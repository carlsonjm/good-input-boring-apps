name: Arch current

# Builds and checks Good Input PDF against Arch Linux's current Qt and Poppler,
# so an update that breaks the build shows here before it reaches a device.
on:
  pull_request:
    # A Markdown-only change runs no build.
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Arch current
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake git python pkgconf \
            qt6-base qt6-declarative qt6-svg poppler-qt6 \
            appstream desktop-file-utils

      - uses: actions/checkout@v5

      - name: Record the Qt and Poppler versions checked
        run: pacman -Q qt6-base qt6-declarative poppler-qt6

      - name: Run ./verify.sh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./verify.sh

      - name: Keep the screens drawn
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: build/screens/
