name: PDF on Arch current

# Builds and checks Good Input PDF (pdf/) against Arch Linux's current Qt and Poppler,
# so an update that breaks the build shows here before it reaches a device.
on:
  # Only a change to the PDF app, or to this file, runs it; Markdown alone runs nothing.
  pull_request:
    paths: ['pdf/**', '!pdf/**.md', '.github/workflows/pdf.yml']
  push:
    branches: [main]
    paths: ['pdf/**', '!pdf/**.md', '.github/workflows/pdf.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-arch-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: PDF on Arch current
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
    timeout-minutes: 30
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake git python pkgconf \
            qt6-base qt6-declarative qt6-svg poppler-qt6 \
            appstream desktop-file-utils

      - uses: actions/checkout@v5

      - name: Record the Qt and Poppler versions checked
        run: pacman -Q qt6-base qt6-declarative poppler-qt6

      - name: Run ./verify.sh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cd pdf && ./verify.sh

      - name: Keep the screens drawn
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-screens
          path: pdf/build/screens/
