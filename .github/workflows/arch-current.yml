name: Arch current

# Builds and checks the office apps against Arch Linux's current Qt and
# LibreOffice, so an update that breaks them shows here before a device.
on:
  pull_request:
    # A Markdown-only change runs no build.
    paths-ignore: ['**.md']
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Arch current
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/archlinux/archlinux:latest
    timeout-minutes: 60
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake git qt6-base qt6-declarative qt6-svg libreoffice-fresh ttf-liberation
          # LibreOfficeKit's headers come with the engine on some builds and
          # with its SDK on others.
          test -f /usr/include/LibreOfficeKit/LibreOfficeKit.hxx \
            || pacman -S --noconfirm --needed libreoffice-fresh-sdk

      - uses: actions/checkout@v5

      - name: Record the Qt and LibreOffice versions checked
        run: pacman -Q qt6-base qt6-declarative libreoffice-fresh

      - name: Run ./verify.sh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./verify.sh
